[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tricount-extractor"
version = "0.2.1"
description = "Extract and save Tricount registries to Excel files"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Wenceslas Sanchez" }]
keywords = ["tricount", "excel", "export", "expenses", "splitwise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.4",
]

[project.scripts]
tricount-extractor = "tricount_extractor.main:main"

[project.urls]
Repository = "https://github.com/wenceslas-sanchez/tricount-extractor"
Changelog = "https://github.com/wenceslas-sanchez/tricount-extractor/blob/main/CHANGELOG.md"
Issues = "https://github.com/wenceslas-sanchez/tricount-extractor/issues"

[tool.hatch.build.targets.wheel]
exclude = ["tricount_extractor/tests"]

[dependency-groups]
lint = [
    "pre-commit==4.6.2",
    "ruff==0.16.8",
]
dev = [
    "pytest==9.1.1",
]
