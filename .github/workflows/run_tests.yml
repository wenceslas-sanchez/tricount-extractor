name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.12", "3.13", "3.14" ]

    steps:
      - name: Get the project
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest --verbose

  # Single required status check for branch protection, whatever the matrix.
  tests:
    needs: pytest
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check all OS and Python versions passed
        run: |
          if [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "pytest matrix result: ${{ needs.pytest.result }}"
            exit 1
          fi
